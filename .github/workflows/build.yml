name: Build PixelLedger APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      PROJECT_B64: ""
    steps:
      - name: Extract PixelLedger Android Source
        run: |
          echo "$PROJECT_B64" | base64 -d | tar -xzf -
          ls -la app/keystore/pixel_ledger.jks app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK for Pixel 9 Pro
        uses: actions/upload-artifact@v4
        with:
          name: PixelLedger-APK
          path: app/build/outputs/apk/debug/app-debug.apk
